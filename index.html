<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unknownscientistś — A Thought Towards A Golden Future</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Star Flare Background Canvas -->
  <canvas id="starfieldCanvas"></canvas>

  <div class="layout-wrapper">
    
    <!-- Top Bar Header -->
    <header class="site-header">
      <div class="brand-logo">
        <span class="logo-accent">unknown</span>scientistś
      </div>
      <div class="top-checkbox-wrapper">
        <label class="checkbox-container">
          <input type="checkbox" id="joinOrgCheck">
          <span class="checkmark"></span>
          <span class="checkbox-label">I want to know how I can be a part of your organization.</span>
        </label>
      </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">A Thought Towards,</h1>
        <h2 class="hero-subtitle">A Golden Future</h2>
        
        <form class="subscription-form" onsubmit="event.preventDefault();">
          <div class="input-group">
            <label for="emailInput">Email*</label>
            <input type="email" id="emailInput" placeholder="Enter your email address" required>
          </div>
          <button type="submit" class="btn-send">Send</button>
        </form>
      </div>

      <!-- Rotating Hero Media Box -->
      <div class="hero-media-container">
        <div class="hero-slider">
          <div class="slide active">
            <img src="hero-image.jpeg" alt="Hero Slide 1">
          </div>
          <div class="slide">
            <img src="hero-image2.jpeg" alt="Hero Slide 2">
          </div>
          <div class="slide">
            <img src="hero-image3.jpeg" alt="Hero Slide 3">
          </div>

          <!-- Animated Overlay Effects: Particles, Pulsing Cell Core & DNA Strand -->
          <div class="dna-rotation-overlay"></div>
          <div class="cell-core-pulse"></div>
          <div class="particles-layer">
            <span class="p-particle"></span>
            <span class="p-particle"></span>
            <span class="p-particle"></span>
            <span class="p-particle"></span>
            <span class="p-particle"></span>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Contact & Info Section -->
    <footer class="site-footer">
      <div class="footer-columns">
        <div class="footer-col brand-col">
          <h3>unknownscientistś</h3>
          <p class="copyright">&copy; 2026 by unknownscientistś.</p>
        </div>

        <div class="footer-col contact-col">
          <h4>Contact</h4>
          <p><a href="tel:+263774206250">+263 774 206250</a></p>
          <p><a href="mailto:uns@gmail.com">uns@gmail.com</a></p>
          <p>7 Hex, Queensdale, Harare</p>
        </div>

        <div class="footer-col links-col">
          <h4>Legal</h4>
          <p><a href="privacy.html" target="_blank" rel="noopener">Ftt Privacy Policy</a></p>
          <p><a href="terms.html" target="_blank" rel="noopener">Ftt Terms</a></p>
        </div>
      </div>
    </footer>

  </div>

  <!-- Auto-Rotation & Star Flare Logic -->
  <script>
    // 1. Auto Rotating 16:9 Carousel (3 seconds interval)
    const slides = document.querySelectorAll('.hero-slider .slide');
    let currentSlide = 0;

    function rotateSlides() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
    setInterval(rotateSlides, 4000);

    // 2. Star Flare Background Canvas Simulation
    const canvas = document.getElementById('starfieldCanvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    const starCount = 60;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class StarFlare {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random();
        this.speed = Math.random() * 0.01 + 0.005;
        this.increasing = Math.random() > 0.5;
        this.color = Math.random() > 0.3 ? '#E0CA0F' : '#FFFFFF';
      }

      update() {
        if (this.increasing) {
          this.alpha += this.speed;
          if (this.alpha >= 1) this.increasing = false;
        } else {
          this.alpha -= this.speed;
          if (this.alpha <= 0.1) this.increasing = true;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        
        // Draw Core
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        // Subtle Lens Flare Cross
        if (this.size > 1.8) {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(this.x - this.size * 4, this.y);
          ctx.lineTo(this.x + this.size * 4, this.y);
          ctx.moveTo(this.x, this.y - this.size * 4);
          ctx.lineTo(this.x, this.y + this.size * 4);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    for (let i = 0; i < starCount; i++) {
      stars.push(new StarFlare());
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.update();
        star.draw();
      });
      requestAnimationFrame(animateStars);
    }
    animateStars();
  </script>
</body>
</html>
