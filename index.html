<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>unknownscientistś | A Thought Towards A Golden Future</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Star Flares & Particle Canvas -->
  <canvas id="starfieldCanvas"></canvas>

  <!-- Interactive Subtle DNA & Cell Overlay Background -->
  <div class="bio-animation-container">
    <div class="pulsing-cell-core"></div>
    <div class="slow-dna-helix"></div>
  </div>

  <div class="page-wrapper">
    <!-- Header / Navbar Section -->
    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="logo-container">
          <img src="logo.jpg" alt="unknownscientistś logo" class="brand-logo-img">
          <span class="brand-logo-text">
            <span class="logo-silver">unknown</span><span class="logo-gold">scientistś</span>
          </span>
        </a>
      </div>
    </header>

    <!-- Hero Section -->
    <main class="hero-section">
      <div class="hero-container">
        
        <!-- Left Side: Content Box -->
        <div class="hero-content">
          <h1 class="main-headline">A Thought Towards,</h1>
          <h2 class="sub-headline">A Golden Future</h2>
          
          <div class="contact-card">
            <div class="contact-item">
              <span class="item-label">Phone</span>
              <a href="tel:+263774206250" class="item-value">+263 774 206250</a>
            </div>
            <div class="contact-item">
              <span class="item-label">Email</span>
              <a href="mailto:uns@gmail.com" class="item-value">uns@gmail.com</a>
            </div>
            <div class="contact-item">
              <span class="item-label">Address</span>
              <p class="item-value">7 Hex, Queensdale, Harare</p>
            </div>
          </div>
        </div>

        <!-- Right Side: 16:9 Rotating Hero Image Slider -->
        <div class="hero-media">
          <div class="slider-wrapper">
            <div class="slide active" style="background-image: url('hero-image.jpg');"></div>
            <div class="slide" style="background-image: url('hero-image2.jpg');"></div>
            <div class="slide" style="background-image: url('hero-image3.jpg');"></div>
          </div>
          <div class="slider-dots">
            <span class="dot active" onclick="setSlide(0)"></span>
            <span class="dot" onclick="setSlide(1)"></span>
            <span class="dot" onclick="setSlide(2)"></span>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer Section -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-copy">
          &copy; 2026 by unknownscientistś.
        </div>
        <nav class="footer-links">
          <a href="https://github.io/privacy.html" target="_blank" rel="noopener noreferrer">Ftt Privacy Policy</a>
          <span class="footer-separator">|</span>
          <a href="https://github.io/terms.html" target="_blank" rel="noopener noreferrer">Ftt Terms</a>
        </nav>
      </div>
    </footer>
  </div>

  <!-- Background Flares and Carousel JS Script -->
  <script>
    // Carousel Logic
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
        dots[i].classList.toggle('active', i === index);
      });
      currentSlide = index;
    }

    function setSlide(index) {
      showSlide(index);
    }

    setInterval(() => {
      let next = (currentSlide + 1) % slides.length;
      showSlide(next);
    }, 5000);

    // Drifting Star Flares & Particle Canvas Logic
    const canvas = document.getElementById('starfieldCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class StarParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = -Math.random() * 0.4 - 0.1;
        this.isFlare = Math.random() > 0.85;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.isFlare ? '#E0CA0F' : '#CFCFCE';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        if (this.isFlare) {
          ctx.strokeStyle = '#E0CA0F';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(this.x - this.size * 3, this.y);
          ctx.lineTo(this.x + this.size * 3, this.y);
          ctx.moveTo(this.x, this.y - this.size * 3);
          ctx.lineTo(this.x, this.y + this.size * 3);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 75; i++) {
      particles.push(new StarParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
